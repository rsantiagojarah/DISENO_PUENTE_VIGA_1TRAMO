version_esquema: 1
comando: diseno-estribos-conectados-2
nota: Geometria inicial editable de ver_2l.pdf. Ambos estribos son iguales; base uniforme,
  trasdos vertical y cara interior inclinada. Relleno hasta coronacion del parapeto;
  sin relleno interior. Ingrese solo dimensiones independientes. Espesor superior
  = asiento + parapeto; luz inferior = luz superior - 2*(espesor inferior - superior);
  ancho total = luz inferior + 2*(espesor inferior + talon). Cargas iniciales conservadas
  del comando original, editables. Materiales, suelo y altura adicional de frenado
  son referenciales, no datos del PDF. Reacciones izquierda/derecha del mismo posicionamiento
  del tablero.
