nota: >-
  Modelo B de MODELO_B_ESTRIBO.pdf. Valores de ejemplo editables: el PDF no tiene
  cotas numericas. Relleno horizontal. t_sup es el nucleo rectangular (region 4).
  N se calcula como t_sup+t2-b_parapeto; se ha omitido longitud_cajuela_m para
  permitir editar esas tres dimensiones. Las alturas del bloque y de la transicion
  son entradas adicionales necesarias para definir las regiones del esquema.
